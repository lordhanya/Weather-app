<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WeatherSphere — explore weather on an interactive 3D globe">
    <title>WeatherSphere</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <canvas id="globe-canvas"></canvas>

        <header class="top-bar">
            <a class="logo" href="/" aria-label="WeatherSphere home">
                <svg class="logo-mark" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                    <circle cx="14" cy="14" r="11.5" stroke="currentColor" stroke-width="1.6"/>
                    <ellipse cx="14" cy="14" rx="11.5" ry="5" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
                    <ellipse cx="14" cy="14" rx="5" ry="11.5" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
                    <circle cx="14" cy="14" r="2.2" fill="currentColor"/>
                </svg>
                <span class="logo-text">Weather<span class="logo-accent">Sphere</span></span>
            </a>

            <div class="search-wrap" role="search">
                <svg class="search-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                    <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.6"/>
                    <path d="M12.5 12.5L16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search cities, countries…"
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Search for a location"
                    aria-controls="search-results"
                    aria-expanded="false"
                >
                <kbd class="search-kbd" aria-hidden="true">/</kbd>
                <div id="search-results" class="search-results" role="listbox" hidden></div>
            </div>

            <button id="locate-btn" class="ctrl-btn" title="Find my location" aria-label="Find my location">
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <circle cx="10" cy="10" r="3.2" stroke="currentColor" stroke-width="1.6"/>
                    <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.4" opacity="0.4"/>
                    <path d="M10 1.5V4M10 16V18.5M1.5 10H4M16 10H18.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
            </button>
        </header>

        <aside id="weather-panel" class="weather-panel" hidden>
            <div class="panel-inner">
                <header class="panel-top">
                    <div class="panel-loc">
                        <h2 id="location-name">—</h2>
                        <p id="location-coords" class="coords">—</p>
                    </div>
                    <button id="panel-close" class="panel-close" aria-label="Close panel">
                        <svg viewBox="0 0 14 14" fill="none"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                    </button>
                </header>

                <div id="panel-loading" class="panel-state">
                    <div class="loader"></div>
                    <span>Fetching weather…</span>
                </div>

                <div id="panel-error" class="panel-state panel-state--error" hidden>
                    <span>Could not retrieve weather data for this location.</span>
                </div>

                <div id="panel-content" class="panel-body" hidden>
                    <div class="cur-row">
                        <span id="weather-emoji" class="cur-icon" aria-hidden="true">🌡️</span>
                        <div class="cur-meta">
                            <div class="cur-temp-line">
                                <span id="current-temp" class="cur-temp">--</span>
                                <span id="feels-like" class="cur-feels">—</span>
                            </div>
                            <span id="current-condition" class="cur-cond">—</span>
                        </div>
                    </div>

                    <div class="stat-grid">
                        <div class="stat">
                            <span class="stat-k">Humidity</span>
                            <span id="detail-humidity" class="stat-v">—</span>
                        </div>
                        <div class="stat">
                            <span class="stat-k">Wind</span>
                            <span id="detail-wind" class="stat-v">—</span>
                        </div>
                        <div class="stat">
                            <span class="stat-k">Precip</span>
                            <span id="detail-precip" class="stat-v">—</span>
                        </div>
                        <div class="stat">
                            <span class="stat-k">Pressure</span>
                            <span id="detail-pressure" class="stat-v">—</span>
                        </div>
                    </div>

                    <div class="forecast">
                        <div class="forecast-head">
                            <span>7-Day Forecast</span>
                            <span class="forecast-tz" id="forecast-tz"></span>
                        </div>
                        <div id="forecast-list" class="forecast-list"></div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="hint" id="hint">
            <span class="hint-pulse"></span>
            Drag to explore · Click a point for weather
        </div>

        <div id="coord-tip" class="coord-tip" hidden></div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
